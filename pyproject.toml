[project]
name = "photo2stamp"
version = "1.0.0"
description = "Turn photos into flat, stamp-style illustrations with classic image processing (no generative AI, CPU only)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "shiyow5" }]
keywords = ["image-processing", "illustration", "stamp", "opencv", "svg", "flat-design"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
]
dependencies = [
    "numpy>=1.24",
    "opencv-contrib-python-headless>=4.8",
    "scipy>=1.10",
]

[project.urls]
Homepage = "https://github.com/shiyow5/photo2stamp"
Issues = "https://github.com/shiyow5/photo2stamp/issues"

[project.scripts]
photo2stamp = "photo2stamp.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/photo2stamp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=photo2stamp --cov-report=term-missing"

[tool.hatch.build.targets.sdist]
exclude = ["examples", ".github", "uv.lock"]
