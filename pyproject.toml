[project]
name = "photo2stamp"
version = "0.1.0"
description = "Turn photos into flat, stamp-style illustrations with classic image processing (no generative AI, CPU only)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "scipy>=1.10",
]

[project.scripts]
photo2stamp = "photo2stamp.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/photo2stamp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=photo2stamp --cov-report=term-missing"
